seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 5100
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: null
check_for_nan: true
save_interval: 250
experiment_name: TesolloDelto_vtdex
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: Tesollo_Delto_RL.tasks.direct.tesollo_delto_rl.vtdex_policy:VTDexActorModel
  hidden_dims:
  - 1024
  - 1024
  - 512
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.8
    std_type: scalar
  proprioception_dim: 40
  vtdex_embedding_dim: 384
  projection_dim: 128
critic:
  class_name: MLPModel
  hidden_dims:
  - 1024
  - 1024
  - 512
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.96
  lam: 0.95
  entropy_coef: 0.0
  desired_kl: 0.016
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
